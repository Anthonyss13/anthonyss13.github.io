<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anthony Silveira | Web Design</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2eee8;
            color: #253444;
            line-height: 1.6;
        }

        /* Header */

        header {
            min-height: 480px;
            padding: 100px 7%;
            display: flex;
            align-items: center;
            justify-content: flex-end;

            background-color: #384655;
            background-image:
                linear-gradient(
                    to right,
                    rgba(15, 25, 35, 0.15),
                    rgba(15, 25, 35, 0.85)
                ),
                url("assets/img/download.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff;
        }

        .header-text {
            max-width: 520px;
            text-align: right;
        }

        .header-line {
            width: 65px;
            height: 4px;
            margin: 0 0 25px auto;
            background-color: #a9c7da;
            border-radius: 4px;
        }

        header h1 {
            margin: 0 0 18px;
            font-size: clamp(38px, 5vw, 64px);
            line-height: 1.1;
            letter-spacing: -2px;
        }

        header h2 {
            margin: 0 0 22px;
            font-size: 25px;
            font-weight: normal;
            color: #d1e1ec;
        }

        header p {
            margin: 0;
            font-size: 18px;
            color: #edf1f4;
        }

        /* Exercises */

        main {
            background-color: #f2eee8;
            padding: 50px 20px;
            text-align: center;
        }

        section h2 {
            margin: 0 0 30px;
            font-size: 30px;
            font-weight: normal;
            color: #304c63;
        }

        section p {
            margin: 0 0 20px;
        }

        section a {
            color: #456780;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
        }

        section a:hover {
            color: #253444;
            text-decoration: underline;
        }

        /* Footer */

        footer {
            padding: 22px;
            border-top: 1px solid #dcdedc;
            text-align: center;
            color: #647382;
            font-size: 14px;
        }

        footer p {
            margin: 0;
        }

        /* Small screens */

        @media (max-width: 767px) {
            header {
                min-height: 400px;
                padding: 70px 7%;
                background-image:
                    linear-gradient(
                        rgba(15, 25, 35, 0.65),
                        rgba(15, 25, 35, 0.80)
                    ),
                    url("assets/img/download.png");
            }

            header h2 {
                font-size: 22px;
            }

            main {
                padding: 40px 20px;
            }

            section h2 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header-text">
            <div class="header-line" aria-hidden="true"></div>

            <h1>Anthony Silveira</h1>

            <h2>Welcome to my website.</h2>

            <p>
                I created this website to showcase some of my recent web design work.
            </p>
        </div>
    </header>

    <main>
        <section>
            <h2>My Web Design Exercises</h2>

            <p>
                <a href="exercises/page-1.html">
                    A Tale of Two Cities
                </a>
            </p>

            <p>
                <a href="exercises/page-2.html">
                    Purple rain
                </a>
            </p>

            <p>
                <a href="exercises/page-3.html">
                    Big Heading
                </a>
            </p>

            <p>
                <a href="exercises/page-4.html">
                    Vincent Van Gogh
                </a>
            </p>

            <p>
                <a href="exercises/page-5.html">
                    Places to Visit in Ireland
                </a>
            </p>
        </section>
    </main>

    <footer>
        <p>Anthony Silveira | Web Design</p>
    </footer>
</body>

</html>
