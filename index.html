        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
            color: #222222;
        }


        /* Header */

        header {
            background-color: #ffffff;
        }

        header h1 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        header h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: normal;
        }


        /* Main content */

        section {
            background-color: #ffffff;
        }

        section p {
            margin-top: 0;
            margin-bottom: 20px;
        }


        /* Links */

        a {
            color: #0066cc;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }


        /* Small screens */

        @media (max-width: 767px) {

            header {
                padding: 30px 5%;
            }

            section {
                padding: 30px 5%;
            }

        }


        /* Large screens */

        @media (min-width: 768px) {

            }

            }

        }

    </style>
