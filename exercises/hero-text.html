<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hero Block with Image</title>
    <meta name="description"
          content="A hero block with a background image and a tinted overlay.">

    <link rel="preload" href="../assets/img/business.jpg" as="image">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
        header {
            @apply relative
            min-h-[60vh] md:min-h-[80vh]
            bg-gray-600
            bg-[url('../assets/img/business.jpg')]
            bg-cover bg-center md:bg-top bg-no-repeat
            flex flex-col justify-center items-center
            px-8 lg:px-60 py-12
            text-center overflow-hidden;
        }

        /* Camada preta com 40% de opacidade */
        header::before {
            content: "";
            @apply absolute inset-0 bg-black/40;
        }

        /* Mantém os textos acima da camada escura */
        header h1,
        header h2 {
            @apply relative z-10 text-shadow-lg/30;
        }

        header h1 {
            @apply text-7xl md:text-8xl
            text-white font-bold tracking-tight;
        }

        header h2 {
            @apply mt-6 text-4xl md:text-5xl text-white;
        }

        /* Animista — https://animista.net/
           FreeBSD License: https://animista.net/license */
        .slide-in-top {
            animation: slide-in-top 1s
                cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
        }

        .slide-in-left {
            animation: slide-in-left 0.5s
                cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
        }

        @keyframes slide-in-top {
            0% {
                transform: translateY(-1000px);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slide-in-left {
            0% {
                transform: translateX(-1000px);
                opacity: 0;
            }

            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1 class="slide-in-top">Anthony Silveira</h1>
        <h2 class="slide-in-left">Creative Web Developer</h2>
    </header>
</body>
</html>
